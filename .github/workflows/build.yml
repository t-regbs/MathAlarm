name: Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop, "codex/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check device runner cleanup
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

      # Runs common and Android host tests across all modules
      - name: Run host suites
        run: ./gradlew :core:testAndroidHostTest :shared:testAndroidHostTest :androidApp:testDebugUnitTest --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  device:
    name: Alarm delivery API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[30, 32, 35, 36]' || '[35]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and test APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          EXTENDED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci_alarm_delivery.sh
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alarm-delivery-api-${{ matrix.api }}
          path: build/alarm-device-results/

  ios:
    name: iOS shared tests and app build
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Show build tool versions
        run: |
          xcodebuild -version
          java -version
      - name: Run native shared and platform tests
        run: ./gradlew :core:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --continue
      - name: Verify durable handoff queue
        run: |
          swiftc iosApp/iosApp/PendingDeeplinkStore.swift iosApp/tests/PendingDeeplinkStoreSmoke.swift -o "$RUNNER_TEMP/mathalarm-handoff-test"
          "$RUNNER_TEMP/mathalarm-handoff-test"
      - name: Build Swift iOS app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mathalarm-ios" CODE_SIGNING_ALLOWED=NO build
          plutil -lint "$RUNNER_TEMP/mathalarm-ios/Build/Products/Debug-iphonesimulator/MathAlarm.app/PrivacyInfo.xcprivacy"
      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
