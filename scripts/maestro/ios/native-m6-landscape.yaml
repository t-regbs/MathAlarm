# English, disposable iPhone/iPad. Run after portrait settings/keyboard checks.
# Native OS orientation is exercised, then restored to portrait. The child flow
# creates and discards only an unsaved editor/preview fixture.
appId: com.timilehinaregbesola.mathalarm
---
- runFlow:
    file: native-m6-keyboard.yaml
    env:
      REQUIRE_VISIBLE_TASK: "false"
      CHALLENGE_ORIENTATION: LANDSCAPE_LEFT
- takeScreenshot: native-landscape-root-after-preview-return
- setOrientation: PORTRAIT
